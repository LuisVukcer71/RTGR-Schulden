<div class="modal-backdrop" [class.closing]="isClosing" (click)="closeModal()">

  <!-- Solange die Freundesliste noch lädt, zeigt sich nur der abgedunkelte
       Hintergrund + ein Ladeindikator - die Sheet erscheint erst, wenn
       die Daten wirklich da sind, statt erst leer und dann nachladend. -->
  @if (isLoadingFriends) {
    <div class="modal-loading" aria-live="polite">
      <span class="btn-spinner" aria-hidden="true"></span>
      <span>Wird geladen...</span>
    </div>
  } @else {
  <div class="modal-card" [class.closing]="isClosing" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <h2>Neue Rechnung</h2>
      <button class="close-btn" (click)="closeModal()" [disabled]="isSubmitting || isClosing">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Formular -->
    <div class="modal-body">
      
      <!-- Verwendungszweck -->
      <div class="input-group">
        <label>Wofür?</label>
        <input type="text" [(ngModel)]="title" placeholder="z.B. Restaurant, Kino, Wocheneinkauf..." [disabled]="isSubmitting" />
      </div>

      <!-- Betrag -->
      <div class="input-group">
        <label>Gesamtbetrag</label>
        <div class="amount-input-wrapper">
          <span class="currency">€</span>
          <input type="number" [(ngModel)]="totalAmount" placeholder="0.00" step="0.01" min="0.01" [disabled]="isSubmitting" />
        </div>
      </div>

      <!-- Wer hat bezahlt? -->
      <div class="input-group">
        <label>Bezahlt von</label>
        <div class="chips-grid" role="radiogroup" aria-label="Bezahlt von">
          <button
            type="button"
            class="chip"
            [class.active]="paidBy === 'Ich'"
            [attr.aria-pressed]="paidBy === 'Ich'"
            [disabled]="isSubmitting"
            (click)="selectPayer('Ich')">
            Ich
          </button>
          <button
            type="button"
            class="chip"
            *ngFor="let friend of friends"
            [class.active]="paidBy === friend"
            [attr.aria-pressed]="paidBy === friend"
            [disabled]="isSubmitting"
            (click)="selectPayer(friend)">
            {{ friend }}
          </button>
        </div>
      </div>

      <!-- Wer war dabei? (Chips Auswahl) -->
      <div class="input-group">
        <label>Beteiligte Personen ({{ selectedParticipants.length }})</label>
        <div class="chips-grid" role="group" aria-label="Beteiligte Personen">
          <button
            type="button"
            class="chip"
            [class.active]="selectedParticipants.includes('Ich')"
            [attr.aria-pressed]="selectedParticipants.includes('Ich')"
            [disabled]="isSubmitting"
            (click)="toggleParticipant('Ich')">
            Ich
          </button>
          <button
            type="button"
            class="chip"
            *ngFor="let friend of friends"
            [class.active]="selectedParticipants.includes(friend)"
            [attr.aria-pressed]="selectedParticipants.includes(friend)"
            [disabled]="isSubmitting"
            (click)="toggleParticipant(friend)">
            {{ friend }}
          </button>
        </div>
      </div>

      <!-- Live Vorschau Box -->
      <div class="preview-box" *ngIf="totalAmount && selectedParticipants.length > 0">
        <div class="preview-row">
          <span>Anteil pro Person:</span>
          <span class="highlight-amount">{{ perPersonShare | currency:'EUR':'symbol':'1.2-2' }}</span>
        </div>
      </div>

      <!-- Fehlermeldung -->
      <div class="error-box" *ngIf="errorMessage" role="alert" aria-live="assertive">
        {{ errorMessage }}
      </div>

    </div>

    <!-- Footer Actions -->
    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()" [disabled]="isSubmitting || isClosing">Abbrechen</button>
      <button class="btn-submit" (click)="submitBill()" [disabled]="isSubmitting || isClosing">
        <span class="btn-spinner" *ngIf="isSubmitting" aria-hidden="true"></span>
        {{ isSubmitting ? 'Wird gespeichert...' : 'Rechnung aufteilen' }}
      </button>
    </div>

  </div>
  }
</div>
