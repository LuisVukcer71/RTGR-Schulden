<div class="app-viewport">

  <!-- HEADER -->
  <div class="scroll-header-group">
    <div class="scroll-header-content">
      <nav class="sticky-tabs-container">
        <app-bubble width="100%">
          <div class="header-title-box">
            <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="7" r="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Dein Profil</span>
          </div>
        </app-bubble>
      </nav>
    </div>
  </div>

  <!-- PROFIL INHALT -->
  <main class="transactions-section">
    <div class="list-fade-wrapper">
      
      <!-- USER KARTE -->
      <div class="transaction-card">
        <app-bubble width="100%">
          <div class="card-inner profile-card-inner">
            <div class="profile-avatar-large">
              {{ currentUser?.username ? currentUser.username.charAt(0).toUpperCase() : 'U' }}
            </div>
            <div class="profile-info">
              <span class="profile-name">{{ currentUser?.username || 'Eingeloggter Benutzer' }}</span>
              <span class="profile-email">Aktiv in der SchuldenApp</span>
            </div>
          </div>
        </app-bubble>
      </div>

      <!-- EINSTELLUNGEN & INFOS -->
      <div class="transaction-card">
        <app-bubble width="100%">
          <div class="info-card">
            <div class="info-card-header">
              <h3 class="info-card-title">App-Informationen</h3>
            </div>

            <div class="info-row">
              <span class="info-row-label">Version</span>
              <span class="info-row-value">{{ appVersion }}</span>
            </div>

            <div class="info-row">
              <span class="info-row-label">Authentifizierung</span>
              <span class="info-row-value is-accent">JWT</span>
            </div>
          </div>
        </app-bubble>
      </div>

      <!-- LOGOUT BUTTON -->
      <div class="transaction-card logout-card">
        <app-bubble width="100%">
          <button type="button" class="logout-btn" (click)="logout()">
            <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="16 17 21 12 16 7" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="21" y1="12" x2="9" y2="12" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Abmelden</span>
          </button>
        </app-bubble>
      </div>

    </div>
  </main>

</div>
