<div class="light-cone-wrapper">
  <div class="light-edge-line"></div>
  <div class="light-cone-main"></div>
  <div class="light-cone-ambient"></div>
</div>

<div class="app-viewport">

  <!-- HEADER -->
  <div class="scroll-header-group">
    <div class="scroll-header-content">
      <nav class="sticky-tabs-container">
        <bubble width="100%">
          <div class="header-title-box">
            <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="7" r="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Dein Profil</span>
          </div>
        </bubble>
      </nav>
    </div>
  </div>

  <!-- PROFIL INHALT -->
  <main class="transactions-section">
    <div class="list-fade-wrapper">
      
      <!-- USER KARTE -->
      <div class="transaction-card">
        <bubble width="100%">
          <div class="card-inner profile-card-inner">
            <div class="profile-avatar-large">
              {{ currentUser?.username ? currentUser.username.charAt(0).toUpperCase() : 'U' }}
            </div>
            <div class="profile-info">
              <span class="profile-name">{{ currentUser?.username || 'Eingeloggter Benutzer' }}</span>
              <span class="profile-email">Aktiv in der SchuldenApp</span>
            </div>
          </div>
        </bubble>
      </div>

      <!-- EINSTELLUNGEN & INFOS -->
      <div class="transaction-card">
        <bubble width="100%">
          <div class="empty-state" style="text-align: left; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <h3 style="color: #f1f5f9; margin: 0; font-size: 1rem; font-weight: 700;">App-Informationen</h3>
              <span style="font-size: 0.7rem; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 2px 8px; border-radius: 20px; font-weight: 600;">Secure</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.75rem;">
              <span style="color: #94a3b8; font-size: 0.85rem;">Version</span>
              <span style="color: #f1f5f9; font-weight: 700; font-size: 0.95rem;">{{ appVersion }}</span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.75rem;">
              <span style="color: #94a3b8; font-size: 0.85rem;">Datenbank-Status</span>
              <span style="color: #10b981; font-weight: 700; font-size: 0.95rem;">Verbunden</span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="color: #94a3b8; font-size: 0.85rem;">Verschlüsselung</span>
              <span style="color: #38bdf8; font-weight: 600; font-size: 0.85rem;">JWT Active</span>
            </div>
          </div>
        </bubble>
      </div>

      <!-- LOGOUT BUTTON -->
      <div class="transaction-card" style="margin-top: 1.5rem;">
        <bubble width="100%">
          <button type="button" class="logout-btn" (click)="logout()">
            <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="16 17 21 12 16 7" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="21" y1="12" x2="9" y2="12" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Abmelden</span>
          </button>
        </bubble>
      </div>

    </div>
  </main>

</div>
