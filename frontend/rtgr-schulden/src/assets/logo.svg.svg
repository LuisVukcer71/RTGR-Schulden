<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radialer Verlauf für den blauen Lichtkegel (von hellblauem Kern zu tiefem Schwarz) -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0066ff" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#002b80" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Schatteneffekt für das fliegende Emoji, um Tiefe zu erzeugen -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#0055ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Exakter schwarzer Hintergrund der App -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Der blaue Lichtkegel / Glow in der Mitte -->
  <circle cx="256" cy="256" r="220" fill="url(#blueGlow)" />

  <!-- Dynamische Lichtstrahlen-Effekte für das "Fliegen" -->
  <g opacity="0.4">
    <ellipse cx="256" cy="256" rx="140" ry="50" fill="none" stroke="#33bbff" stroke-width="2" transform="rotate(-30 256 256)" />
    <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="#0088ff" stroke-width="1.5" transform="rotate(25 256 256)" />
  </g>

  <!-- Das fliegende Geld-Emoji in der Mitte (mit leichter Neigung für den Flug-Effekt) -->
  <g filter="url(#dropShadow)" transform="translate(256, 256) rotate(15) scale(3.2) translate(-32, -32)">
    <!-- Hier wird das standardmäßige Geld-Emoji (Fliegendes Geld / Money With Wings) gerendert -->
    <text x="0" y="50" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="52">💸</text>
  </g>
</svg>
